name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check index_engine.py test_index_engine.py
      - run: ruff format --check index_engine.py test_index_engine.py
      - run: python -m unittest -v
        timeout-minutes: 2
      - name: Verify runnable demo against Redis
        run: |
          crypto-index demo --timestamp 1760000000 > demo.json
          python -c "import json; d=json.load(open('demo.json')); assert d['demo'] is True; assert d['tick']['price']=='60133.33333333'"
      - run: python -m build
