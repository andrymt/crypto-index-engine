[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-index-engine"
version = "0.1.0"
description = "Per-second cross-exchange volume-weighted crypto indices backed by Redis hashes"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [{name = "Andrii Trush"}]
dependencies = ["redis==6.4.0"]

[project.optional-dependencies]
dev = ["fakeredis==2.32.1", "ruff==0.14.2", "build==1.3.0"]

[project.scripts]
crypto-index = "index_engine:main"

[project.urls]
Repository = "https://github.com/andrymt/crypto-index-engine"

[tool.setuptools]
py-modules = ["index_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "ASYNC"]
